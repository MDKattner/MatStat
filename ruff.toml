# Advisory lint configuration. `ruff check` is a hint, not a gate: CI reports
# findings but never fails on them (see `.github/workflows/ci.yml`).
target-version = "py313"
line-length = 100

[lint]
select = [ "E4", "E7", "E9", "F" ]

[lint.per-file-ignores]
# The app chdirs to MATSTAT_ROOT before importing the data layer, so the
# imports intentionally follow module-level code.
"scripts/web/app.py" = [ "E402" ]
# The shared path shim and the FakeContext definition precede the imports they
# enable.
"tests/conftest.py" = [ "E402" ]
